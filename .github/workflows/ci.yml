name: CI Pipeline for odoo project

on:
  push:
    branches:
      - dev
env:
  IMAGE_NAME: odoo-project
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # - name: Run a One-Line Script
      #   run: echo "Hello, world!"
      
      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Validate docker-compose.yml
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          echo "✅ docker-compose.yml is valid"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for security scan
        run: docker build -t ${{ env.IMAGE_NAME }}:scan .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: "${{ env.IMAGE_NAME }}:scan"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  test:
    name: Test Odoo
    runs-on: ubuntu-latest
    needs: security

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build test image
        run: docker build -t ${{ env.IMAGE_NAME }}:dev .

      - name: Run Odoo unit tests on custom addons
        run: |
          # Récupère les modules dans custom_addons
          MODULES=$(ls ./custom_addons | grep -v __pycache__ | tr '\n' ',' | sed 's/,$//')
          echo "Testing modules: $MODULES"

          docker run --rm \
            --network host \
            -e HOST=localhost \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            ${{ env.IMAGE_NAME }}:dev \
            odoo -d odoo_test \
              --db_host=localhost \
              --db_port=5432 \
              --db_user=odoo \
              --db_password=odoo \
              --addons-path=/mnt/extra-addons \
              --test-enable \
              --stop-after-init \
              -i "$MODULES" \
            || echo "⚠️ No testable modules found yet (normal for empty custom_addons)"





